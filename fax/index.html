<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>

    <title>Fax | FurryTel</title>
    <meta content="FurryTel Fax Coverpage" property="og:title" />
    <meta content="Fill out a fax coverpage." property="og:description" />
    <meta content="http://furrytel.net" property="og:url" />
    <meta content="http://furrytel.net/assets/ftlogo.png" property="og:image" />
    <meta content="#444444" data-react-helmet="true" name="theme-color" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Comic+Neue:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">    <link rel="stylesheet" href="https://use.typekit.net/vqq2hqe.css">
    <link rel="stylesheet" href="https://use.typekit.net/vqq2hqe.css">
    <link rel='stylesheet' type='text/css' media='all' href='./fax.css'>
    <script src='./fax.js' defer></script>
</head>

<body>
    <div class="toolbar no-print">
        <div class="toolbar-head">
            <form class="input-mode">
                <label title="Type"><input type="radio" name="input-mode" value="text" checked> ⌨️</label>
                <label title="Draw"><input type="radio" name="input-mode" value="draw"> ✏️</label>
            </form>
            <button type="button" id="toolbarToggle" title="Minimize toolbar" aria-expanded="true">↗️</button>
        </div>
        <div class="text-toolbar">
            <button type="button" data-cmd="removeFormat" title="Normal (clear formatting)">Normal</button>
            <button type="button" data-cmd="bold" title="Bold (Ctrl/Cmd+B)"><b>B</b></button>
            <button type="button" data-cmd="italic" title="Italic (Ctrl/Cmd+I)"><i>I</i></button>
            <button type="button" data-cmd="underline" title="Underline (Ctrl/Cmd+U)"><u>U</u></button>
            <button type="button" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
            <select id="fontSelect" class="font-select" title="Font">
                <option value="serif" style="font-family: serif">Serif</option>
                <option value="'Open Sans', sans-serif" style="font-family: 'Open Sans', sans-serif" selected>Sans-serif</option>
                <option value="'Source Code Pro', monospace" style="font-family: 'Source Code Pro', monospace">Monospace</option>
                <option value="cursive" style="font-family: cursive">Cursive</option>
                <option value="'Comic Sans MS', 'Comic Neue', cursive" style="font-family: 'Comic Sans MS', 'Comic Neue', cursive">Comic</option>
            </select>
            <select id="sizeSelect" class="font-select" title="Font size">
                <option value="8">8 pt</option>
                <option value="9">9 pt</option>
                <option value="10">10 pt</option>
                <option value="11">11 pt</option>
                <option value="12" selected>12 pt</option>
                <option value="14">14 pt</option>
                <option value="16">16 pt</option>
                <option value="18">18 pt</option>
                <option value="24">24 pt</option>
                <option value="30">30 pt</option>
                <option value="36">36 pt</option>
                <option value="48">48 pt</option>
                <option value="72">72 pt</option>
            </select>
            <label class="toggle-fields" title="Show the To/From/Subject fields and Message label">
                <input type="checkbox" id="showFields" checked> Fields
            </label>
        </div>
        <div class="drawing-toolbar hidden">
            <div class="tools">
                <button type="button" data-tool="pen" class="active" title="Pen">Pen</button>
                <button type="button" data-tool="eraser" title="Eraser">Eraser</button>
                <button type="button" data-tool="line" title="Line (Shift: snap to 45°)">Line</button>
                <button type="button" data-tool="rect" title="Rectangle (Shift: square)">Rect</button>
                <button type="button" data-tool="circle" title="Circle (Shift: perfect circle)">Circle</button>
                <button type="button" data-tool="fill" title="Fill an enclosed area">Fill</button>
            </div>
            <div class="swatches">
                <button type="button" class="swatch active" data-color="#000000" style="background:#000000" title="Black"></button>
                <button type="button" class="swatch" data-color="#404040" style="background:#404040" title="Dark grey"></button>
                <button type="button" class="swatch" data-color="#808080" style="background:#808080" title="Grey"></button>
                <button type="button" class="swatch" data-color="#c0c0c0" style="background:#c0c0c0" title="Light grey"></button>
                <button type="button" class="swatch" data-color="#ffffff" style="background:#ffffff" title="White"></button>
            </div>
            <input type="range" id="drawSize" min="1" max="30" value="3" title="Size">
            <button type="button" id="drawUndo" title="Undo (Ctrl/Cmd+Z)">Undo</button>
            <button type="button" id="drawClear" title="Clear">Clear</button>
        </div>
        <select id="faxQuality" class="quality-select" title="Fax resolution for printing and saved images">
            <option value="98">Normal (204×98)</option>
            <option value="196" selected>Fine (204×196)</option>
            <option value="391">S. Fine (204×391)</option>
        </select>
        <button id="print" type="button" onclick="window.print()">🖨️</button>
        <button id="saveImage" type="button" title="Save as image">💾</button>
    </div>
    <div class="page">
        <canvas id="drawCanvas"></canvas>
        <canvas id="previewCanvas" class="no-print"></canvas>
        <canvas id="printCanvas"></canvas>
        <div id="brushPreview" class="no-print hidden"></div>
        <div class="title">
            <img src="/assets/ftlogo_mono.png" class="logo" height="80">
            <div class="titlestack">
                <h1 class="orgname">FurryTel</h1>
                <h3 class="pagename" contenteditable="true">Facsimile Service</h3>
            </div>
        </div>
        <div class="header-fields">
            <div class="break" style="margin-top: 1em;"></div>
            <div class="fields">
                <div class="field">
                    <span class="field-name">To:</span>
                    <div class="field-area" contenteditable="true"></div>
                </div>
                <div class="field">
                    <span class="field-name">From:</span>
                    <div class="field-area" contenteditable="true"></div>
                </div>
            </div>
            <div class="fields">
                <div class="field">
                    <span class="field-name">Subject:</span>
                    <div class="field-area" contenteditable="true"></div>
                </div>
            </div>
            <div class="break" style="margin-top: 0.75em; margin-bottom: 0;"></div>
        </div>
        <div class="message m_text" contenteditable="true">Message:<br><br><br></div>
    </div>
</body>

</html>
